name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Python linter
        run: python -m pip install --disable-pip-version-check ruff==0.15.21

      - name: Lint Python
        run: |
          ruff check agent data scripts tests
          ruff format --check agent data scripts tests

      - name: Run cleanup unit tests
        run: python -m unittest discover -s tests -v

      - name: Check shell syntax
        run: >-
          bash -n deploy.sh load-data.sh test-private.sh
          scripts/preprovision.sh scripts/postprovision.sh

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { exit 1 }
